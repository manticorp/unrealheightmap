        <h1>16/32 Bit Heightmap Generator</h1>
        <p>A free tool that turns real-world elevation data into 16-bit PNG and 16/32-bit EXR heightmaps, texture maps, 3D models (STL, OBJ, GLB, 3MF), contours and posters for Unreal Engine 5, Godot, Blender, Unity and 3D printing. It runs entirely in your browser: nothing is uploaded, and there are no accounts or paid plans. It needs JavaScript, which is turned off here.</p>
        <p>Settings are stored in the link itself, for example <a href="#lat=36.18112&amp;lng=-112.021&amp;z=10&amp;oz=14&amp;w=8129&amp;h=8129">the Grand Canyon at 64 km</a>.</p>
