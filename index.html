<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>16 Bit Grayscale PNG Heightmap Generator for Unreal Engine</title>
    <script type="module" defer>
      import { polyfillCountryFlagEmojis } from "https://cdn.skypack.dev/country-flag-emoji-polyfill";
      polyfillCountryFlagEmojis();
    </script>
    <link rel="stylesheet" href="public/dist/css/main.css">
    <script data-goatcounter="https://unrealheightmap.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </head>
  <body class="is-app">
    <main id="app" class="app-shell">
      <section class="app-main" aria-label="Map and 3D preview">
        <div class="map-wrap">
          <div id="map"></div>
        </div>
      </section>
    </main>
    <script type="text/javascript" src="public/dist/js/main.js"></script>
  </body>
</html>
